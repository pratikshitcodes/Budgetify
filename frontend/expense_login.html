<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Analyst With AI - Login</title>
    <link rel="stylesheet" href="./expense_login.css" />
  </head>
  <body>
    <div class="login-page">
      <!-- Subtle Background Decorations -->
      <div class="decor-blob decor-blob-1"></div>
      <div class="decor-blob decor-blob-2"></div>
      <div class="decor-lines"></div>

      <div class="login-card" role="region" aria-label="Login">
        <div class="login-header">
          <div class="icon-wrapper">
            <!-- Professional AI/Finance Icon -->
            <svg class="login-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
              <circle cx="18" cy="18" r="3" stroke="#00d2ff" fill="none"></circle>
              <path d="M18 15v-2a3 3 0 0 0-3-3h-3" stroke="#a855f7"></path>
            </svg>
          </div>
          <h1>Finance Analyst With AI</h1>
          <p class="subtitle">AI-powered expense tracking & financial insights</p>
        </div>

        
        <a href="http://127.0.0.1:8000/auth/google/login" class="google-btn">
          <svg viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
            <path fill="none" d="M0 0h48v48H0z"></path>
          </svg>
          Continue with Google
        </a>

        <div class="divider">
          <span>OR</span>
        </div>

        <form id="loginForm" class="login-form">
          <div class="input-group">
            <label for="email" class="field-label">Email or Username</label>
            <input
              id="email"
              name="email"
              type="text"
              autocomplete="username"
              placeholder="Enter email or username"
              required
            />
          </div>

          <div class="input-group">
            <label for="password" class="field-label">Password</label>
            <div class="password-wrapper">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter password"
                required
              />
              <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Toggle Password Visibility">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="login-btn">
            <span>Sign In</span>
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <div id="loginError" class="login-error" aria-live="polite" style="display:none"></div>
        </form>
        
        <div class="auth-link">Don't have an account? <a href="./register.html">Register</a></div>
      </div>
    </div>

    <script src="./expense_login.js"></script>
  </body>
</html>
