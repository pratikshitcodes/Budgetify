<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Analyst With AI - Login</title>
    <link rel="stylesheet" href="./expense_login.css" />
  </head>
  <body>
    <div class="login-page">
      <!-- Subtle Background Decorations -->
      <div class="decor-blob decor-blob-1"></div>
      <div class="decor-blob decor-blob-2"></div>
      <div class="decor-lines"></div>

      <div class="login-card" role="region" aria-label="Login">
        <div class="login-header">
          <div class="icon-wrapper">
            <!-- Professional AI/Finance Icon -->
            <svg class="login-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
              <circle cx="18" cy="18" r="3" stroke="#00d2ff" fill="none"></circle>
              <path d="M18 15v-2a3 3 0 0 0-3-3h-3" stroke="#a855f7"></path>
            </svg>
          </div>
          <h1>Finance Analyst With AI</h1>
          <p class="subtitle">AI-powered expense tracking & financial insights</p>
        </div>

        <form id="loginForm" class="login-form">
          <div class="input-group">
            <label for="email" class="field-label">Email or Username</label>
            <input
              id="email"
              name="email"
              type="text"
              autocomplete="username"
              placeholder="Enter email or username"
              required
            />
          </div>

          <div class="input-group">
            <label for="password" class="field-label">Password</label>
            <div class="password-wrapper">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter password"
                required
              />
              <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Toggle Password Visibility">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="login-btn">
            <span>Sign In</span>
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <div id="loginError" class="login-error" aria-live="polite" style="display:none"></div>
        </form>
      </div>
    </div>

    <script src="./expense_login.js"></script>
  </body>
</html>
